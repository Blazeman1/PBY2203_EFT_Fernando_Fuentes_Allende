spring:
  application:
    name: banco-xyz-batch

  datasource:
    # Base de datos propia del modulo batch dentro del PostgreSQL del ecosistema (ver
    # infra/postgres/init/01-esquema.sql). En docker-compose se sobreescribe con la variable de
    # entorno SPRING_DATASOURCE_URL. Solo valores de demostracion academica.
    url: jdbc:postgresql://localhost:5432/batch_db
    username: bancoxyz
    password: bancoxyz
    driver-class-name: org.postgresql.Driver
    hikari:
      # Optimizacion de recursos del sistema: el pool de conexiones debe cubrir, como minimo,
      # los 3 hilos de procesamiento paralelo (batch.hilos) mas un margen para el JobRepository
      # y los Tasklets de resumen/agregacion que corren en el hilo principal. Ademas,
      # tambien debe cubrir las particiones concurrentes del Job particionado (batch.grid-size,
      # hasta 6 en el benchmark comparativo). Se deja en 12 -no mas- para no agotar las
      # conexiones disponibles del servidor de base de datos ni desperdiciar memoria en
      # conexiones ociosas.
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: BancoXyzHikariPool

  batch:
    job:
      # Deshabilitado a proposito: este proyecto expone 3 Jobs y se selecciona cual ejecutar
      # desde la linea de comandos (ver BancoXyzBatchApplication). Si quedara en 'true', Spring
      # Boot intentaria ejecutar TODOS los Jobs del contexto automaticamente al arrancar.
      enabled: false
    jdbc:
      # Crea automaticamente las tablas de metadata de Spring Batch (BATCH_JOB_INSTANCE,
      # BATCH_STEP_EXECUTION, etc.) la primera vez que se levanta la aplicacion. Estas tablas
      # son las que permiten la re-ejecucion/reanudacion de un Job tras una falla.
      initialize-schema: always

  sql:
    init:
      # Ejecuta src/main/resources/schema.sql (tablas de negocio propias del Banco XYZ) al
      # arrancar. Usa sentencias idempotentes (CREATE TABLE IF NOT EXISTS), por lo que es
      # seguro dejarlo en 'always' incluso en ejecuciones repetidas.
      mode: always

# Parametros propios del proyecto (ver com.bancoxyz.batch.config.BatchProperties).
# Pueden sobreescribirse por linea de comandos, por ejemplo:
#   java -jar banco-xyz-batch.jar intereses --batch.rutas.intereses=file:/ruta/a/otro_archivo.csv
batch:
  chunk-size: 5
  hilos: 3
  # Cantidad de particiones del Job particionado (transacciones-particionado).
  # Sobreescribible por linea de comandos para el benchmark comparativo, por ejemplo:
  #   java -jar banco-xyz-batch.jar transacciones-particionado --batch.grid-size=6
  grid-size: 4
  # Circuito de seguridad, no el umbral de calidad (eso lo hace ControlCalidadDecider por
  # porcentaje). Se deja en 900 porque, verificado programaticamente contra el dataset oficial de
  # la EFT (fin_legacy_data, semana_3, 1000 filas por archivo), el peor caso real
  # (intereses_trimestrales.csv) omite cerca de 780 filas (~78%: cuentas hipoteca o de tipo
  # invalido, edades fuera de rango, saldos vacios y duplicados logicos, todos fuera del alcance
  # del proceso). Un valor bajo haria fallar el Step antes de que el decider evalue el porcentaje.
  limite-omisiones: 900
  maximo-reintentos: 3
  # Reejecucion automatica ante fallos criticos: si un Job termina en FAILED, el lanzador lo
  # vuelve a ejecutar hasta 2 veces mas, esperando 5 s entre intentos, reanudando la misma
  # JobInstance (ver BancoXyzBatchApplication#ejecutar).
  reejecucion-max-intentos: 2
  reejecucion-espera-ms: 5000
  # Porcentaje de registros omitidos a partir del cual el ControlCalidadDecider NO genera el
  # reporte final y deriva el Job a revision manual. Calibrado contra el dataset oficial de la
  # EFT, que trae errores intencionales en gran volumen: ~23% de omisiones en transacciones,
  # ~16% en estados de cuenta y ~78% en intereses (alli la mayoria no son errores, sino cuentas
  # de tipos fuera del alcance del proceso, como hipotecas). Con 85 los tres Jobs generan su
  # reporte y el decider sigue deteniendo un archivo practicamente inservible. Para ver el camino
  # de revision manual basta bajarlo por linea de comandos: --batch.umbral-calidad-porcentaje=20
  umbral-calidad-porcentaje: 85.0
  rutas:
    # Archivos oficiales del caso: https://github.com/KariVillagran/fin_legacy_data (data/semana_3)
    transacciones: classpath:data/movimientos_financieros_diarios.csv
    intereses: classpath:data/intereses_trimestrales.csv
    cuentas-anuales: classpath:data/estados_financieros_anuales.csv

logging:
  pattern:
    # Se incluye [%thread] deliberadamente: es lo que permite ver en la consola, durante la
    # evidencia de ejecucion, como los 3 hilos "Batch-Thread-1/2/3" procesan chunks en paralelo.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{45} - %msg%n"
  level:
    root: INFO
    com.bancoxyz.batch: INFO
    org.springframework.batch: INFO
    org.springframework.jdbc.core: WARN
