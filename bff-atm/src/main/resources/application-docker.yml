# Activado con SPRING_PROFILES_ACTIVE=docker (ver docker-compose.yaml): config-server y
# eureka-server se resuelven por el nombre de su servicio en la red de docker-compose. Las URLs
# de auth-server y de los microservicios vienen de config-server (perfil docker).
spring:
  config:
    import: "optional:configserver:http://config-server:8888"

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
