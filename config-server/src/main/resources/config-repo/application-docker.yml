# Servido cuando el cliente pide el perfil "docker" (SPRING_PROFILES_ACTIVE=docker), fusionado
# sobre application.yml: dentro de la red de docker-compose, auth-server se alcanza por el
# nombre de su servicio, no por "localhost".
seguridad:
  oauth2:
    issuer-uri: http://auth-server:9000
    token-uri: http://auth-server:9000/oauth2/token
