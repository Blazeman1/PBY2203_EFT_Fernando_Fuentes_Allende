server:
  port: 8080

spring:
  application:
    name: cuentas-service
  cloud:
    loadbalancer:
      cache:
        # El balanceador cachea la lista de instancias; 5 s (35 s por defecto) para que
        # refleje rapido los cambios de escala.
        ttl: 5s
  config:
    # Las propiedades de negocio (topicos, issuer OAuth2, credenciales hacia clientes-service)
    # viven en config-server (config-repo/cuentas-service.yml).
    import: "optional:configserver:http://localhost:8888"
  datasource:
    # Base de datos PROPIA de este microservicio (database-per-service): ningun otro servicio
    # lee ni escribe en cuentas_db. Solo valores de demostracion academica.
    url: jdbc:postgresql://localhost:5432/cuentas_db
    username: bancoxyz
    password: bancoxyz
    hikari:
      maximum-pool-size: 10
      pool-name: CuentasHikariPool
  jpa:
    hibernate:
      # El esquema lo crea el script de inicializacion de PostgreSQL (infra/postgres/init),
      # una sola vez y antes de que arranque cualquier replica: asi varias instancias de este
      # servicio pueden iniciar a la vez sin competir por crear las mismas tablas.
      ddl-auto: none
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # Mismo group-id en todas las replicas: Kafka reparte las particiones entre ellas.
      group-id: cuentas-service
      auto-offset-reset: earliest
    producer:
      acks: all

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # Refresca la copia local del registro cada 5 s (30 s por defecto): una replica nueva
    # empieza a recibir trafico, y una caida deja de recibirlo, en pocos segundos.
    registry-fetch-interval-seconds: 5
  instance:
    # Latido cada 5 s y expiracion a los 15 s: Eureka retira rapido una instancia que dejo de responder.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

resilience4j:
  circuitbreaker:
    instances:
      clientesService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          - com.bancoxyz.cuentas.exception.ClienteNoEncontradoException

management:
  endpoints:
    web:
      exposure:
        # /actuator/health es publico (healthcheck); info y metrics exigen el JWT del servicio.
        include: health,info,metrics

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{45} - %msg%n"
  level:
    root: INFO
    com.bancoxyz.cuentas: INFO
