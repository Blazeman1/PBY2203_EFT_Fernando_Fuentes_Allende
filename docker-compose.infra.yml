# Solo la infraestructura de datos y mensajeria (PostgreSQL + Kafka), con sus puertos publicados
# en localhost. Para DESARROLLAR y DEPURAR: los modulos Java se ejecutan desde el IDE (IntelliJ)
# o con "java -jar", usando su configuracion por defecto (localhost).
#
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml down        (agregar -v para borrar los datos)
#
# No usar a la vez que docker-compose.yaml: ambos publican el puerto 5432.
services:

  postgres:
    image: postgres:16-alpine
    container_name: bancoxyz-postgres-dev
    environment:
      POSTGRES_USER: bancoxyz
      POSTGRES_PASSWORD: bancoxyz
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - bancoxyz_pgdata_dev:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bancoxyz -d pagos_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.7.0
    container_name: bancoxyz-kafka-dev
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "4"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  bancoxyz_pgdata_dev:
