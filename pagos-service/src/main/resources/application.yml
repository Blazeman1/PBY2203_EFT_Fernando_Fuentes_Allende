server:
  port: 8087

spring:
  application:
    name: pagos-service
  cloud:
    loadbalancer:
      cache:
        # El balanceador cachea la lista de instancias; 5 s (35 s por defecto) para que
        # refleje rapido los cambios de escala.
        ttl: 5s
  config:
    # Las propiedades de negocio (topicos, issuer OAuth2, credenciales hacia cuentas-service,
    # umbral de alertas) viven en config-server (config-repo/pagos-service.yml).
    import: "optional:configserver:http://localhost:8888"
  datasource:
    # Base de datos PROPIA de este microservicio (database-per-service). Solo valores de
    # demostracion academica.
    url: jdbc:postgresql://localhost:5432/pagos_db
    username: bancoxyz
    password: bancoxyz
    hikari:
      maximum-pool-size: 10
      pool-name: PagosHikariPool
  jpa:
    hibernate:
      # El esquema lo crea el script de inicializacion de PostgreSQL (infra/postgres/init).
      ddl-auto: none
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # Mismo group-id en todas las replicas: Kafka reparte las particiones entre ellas.
      group-id: pagos-service
      auto-offset-reset: earliest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # Refresca la copia local del registro cada 5 s (30 s por defecto): una replica nueva
    # empieza a recibir trafico, y una caida deja de recibirlo, en pocos segundos.
    registry-fetch-interval-seconds: 5
  instance:
    # Latido cada 5 s y expiracion a los 15 s: Eureka retira rapido una instancia que dejo de responder.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

resilience4j:
  retry:
    instances:
      cuentasService:
        # 3 intentos en total (1 original + 2 reintentos), separados por 500 ms.
        max-attempts: 3
        wait-duration: 500ms
        # Los errores de negocio son respuestas correctas de un servicio sano: reintentarlos no
        # cambiaria el resultado. Con el circuito abierto tampoco tiene sentido insistir.
        ignore-exceptions:
          - com.bancoxyz.pagos.exception.CuentaNoEncontradaException
          - com.bancoxyz.pagos.exception.SaldoInsuficienteException
          - com.bancoxyz.pagos.exception.OperacionNoPermitidaException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      cuentasService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.bancoxyz.pagos.exception.CuentaNoEncontradaException
          - com.bancoxyz.pagos.exception.SaldoInsuficienteException
          - com.bancoxyz.pagos.exception.OperacionNoPermitidaException
      # Instancia SEPARADA a proposito: que el broker Kafka este caido no tiene relacion con que
      # cuentas-service este arriba o no; no comparten contador de fallas ni circuito.
      kafkaProducer:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/health es publico (healthcheck); info y metrics exigen el JWT del servicio.
        include: health,info,metrics

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{45} - %msg%n"
  level:
    root: INFO
    com.bancoxyz.pagos: INFO
